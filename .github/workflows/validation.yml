name: Validation Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build temporary artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build validation archives
        shell: bash
        env:
          COMMIT_ID: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p dist
          version="$(go run . --version)"
          short_commit="${COMMIT_ID:0:7}"

          build_target() {
            local goos="$1"
            local goarch="$2"
            local extension="$3"
            local package_name="zju-portal-core_${version}-${short_commit}_${goos}_${goarch}"
            local package_dir="dist/${package_name}"

            mkdir -p "${package_dir}/docs"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -tags with_gvisor \
              -trimpath \
              -ldflags="-s -w -X main.CommitID=${short_commit}" \
              -o "${package_dir}/zju-portal-core${extension}" \
              .
            cp README.md LICENSE "${package_dir}/"
            cp docs/config.yaml docs/control-api.md "${package_dir}/docs/"

            if [[ "$goos" == "windows" ]]; then
              (cd dist && zip -qr "${package_name}.zip" "${package_name}")
            else
              tar -C dist -czf "dist/${package_name}.tar.gz" "${package_name}"
            fi
            rm -rf "$package_dir"
          }

          build_target darwin amd64 ""
          build_target darwin arm64 ""
          build_target linux amd64 ""
          build_target linux arm64 ""
          build_target windows amd64 ".exe"
          build_target windows arm64 ".exe"

          cd dist
          sha256sum ./*.tar.gz ./*.zip > checksums.txt

      - name: Upload validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zju-portal-core-validation-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
